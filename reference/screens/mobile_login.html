<div class="flex items-center justify-between rotate-180 leading-none">

<div class="absolute -bottom-2 bg-error-container text-on-error-container px-space-sm py-0.5 rounded shadow-md rotate-3 flex items-center gap-1">

</button>
</form>
<!-- Community Reroute & Disclaimer -->
<div class="flex flex-col items-center mt-space-md gap-space-xs w-full text-center">

    </div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdField = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('pwdEyeIcon');

    if (toggleBtn && pwdField && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdField.getAttribute('type') === 'password';
        pwdField.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const form = document.getElementById('scrapLoginForm');
    const submitBtn = document.getElementById('submitTableBtn');
    if (form && submitBtn) {
      form.addEventListener('submit', function() {
        submitBtn.classList.add('opacity-90');
        submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[22px]">sync</span> <span class="font-headline-md text-headline-md uppercase tracking-wider">ENTERING ROOM...</span>';
        setTimeout(function() {
          submitBtn.classList.remove('opacity-90');
          submitBtn.innerHTML = '<span class="font-headline-md text-headline-md tracking-wider uppercase">SIGN IN TO TABLE</span><span class="material-symbols-outlined text-[22px]">arrow_forward</span>';
        }, 1200);
      });
    }
  })();
